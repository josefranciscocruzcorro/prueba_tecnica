# Proxy inverso y servidor estático de la consola.
#
# Al exponer los dos microservicios bajo un mismo origen, el navegador no necesita CORS y el
# reparto de rutas queda documentado en un único sitio: /api/clientes va a un servicio y
# /api/cuentas, /api/movimientos y /api/reportes al otro. Cambiar esa topología —por ejemplo,
# partir Movimientos en un tercer servicio— no obliga a tocar el código de la interfaz.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Cabeceras de seguridad básicas. La política de contenido permite la hoja de Google Fonts
    # y las conexiones al propio origen, que es todo lo que la consola necesita.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "same-origin"        always;
    add_header Content-Security-Policy
        "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   512;

    # ── Microservicio de Clientes ────────────────────────────────────────────────────────────
    location /api/clientes {
        proxy_pass         http://clientes-api:8080;
        include            /etc/nginx/cabeceras-proxy.conf;
    }

    # ── Microservicio de Cuentas y Movimientos ───────────────────────────────────────────────
    location /api/cuentas {
        proxy_pass         http://cuentas-api:8080;
        include            /etc/nginx/cabeceras-proxy.conf;
    }

    location /api/movimientos {
        proxy_pass         http://cuentas-api:8080;
        include            /etc/nginx/cabeceras-proxy.conf;
    }

    location /api/reportes {
        proxy_pass         http://cuentas-api:8080;
        include            /etc/nginx/cabeceras-proxy.conf;
    }

    # El index nunca se cachea: así un despliegue nuevo se ve sin forzar recarga.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los archivos no llevan huella en el nombre, así que se revalidan siempre: el navegador
    # reutiliza la copia local solo si el ETag coincide. Un despliegue nuevo se ve de inmediato
    # y aun así no se retransmite nada que no haya cambiado.
    location /assets/ {
        add_header Cache-Control "no-cache";
        etag on;
    }

    # Aplicación de una sola página: cualquier ruta desconocida la resuelve el enrutador del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
